<title>Hydrant Inspection MVP</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;600;700;800&family=Roboto+Mono:wght@400;500&display=swap">
<style>
/* Layout: dark SFPUC header band, step sidebar left, one page shown at a time. */
:root{
  --bg:#F4F6F8; --surface:#FFFFFF; --fg:#1B2530; --muted:#4C5966; --line:#D5DCE3;
  --brand:#004A80; --brand-ink:#FFFFFF; --link:#0074B8; --rule:#007DC3;
  --note-bg:#FFF6E3; --note-line:#FBB034; --code-bg:#EEF2F6; --nav-active:#E3EEF7;
  --sans:"Libre Franklin", "Franklin Gothic Medium", Arial, sans-serif;
  --mono:"Roboto Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1620; --surface:#15202C; --fg:#E6ECF2; --muted:#A5B3C1; --line:#2A3846;
  --brand:#002D74; --brand-ink:#FFFFFF; --link:#7CC4F0; --rule:#007DC3;
  --note-bg:#33280F; --note-line:#FBB034; --code-bg:#1C2A38; --nav-active:#1E3349; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1620; --surface:#15202C; --fg:#E6ECF2; --muted:#A5B3C1; --line:#2A3846;
  --brand:#002D74; --brand-ink:#FFFFFF; --link:#7CC4F0; --rule:#007DC3;
  --note-bg:#33280F; --note-line:#FBB034; --code-bg:#1C2A38; --nav-active:#1E3349; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.6 var(--sans);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:var(--brand-ink);border-bottom:4px solid var(--rule);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:16px}
[id]{scroll-margin-top:110px}
header img{height:40px;width:auto}
header .t{font-weight:700;font-size:1.1rem;letter-spacing:.01em}
header .sub{font-size:.8rem;opacity:.9}
.wrap{display:grid;grid-template-columns:260px minmax(0,1fr);gap:32px;max-width:1240px;margin:0 auto;
  padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px);align-self:start;max-height:calc(100vh - 100px);overflow:auto;font-size:.92rem}
.navgrp{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:18px 0 6px}
nav ul{list-style:none;margin:0;padding:0}
nav a{display:flex;align-items:center;min-height:36px;padding:4px 10px;border-radius:6px;color:var(--fg);text-decoration:none}
nav a:hover{background:var(--nav-active)}
nav a[aria-current="page"]{background:var(--nav-active);color:var(--link);font-weight:700}
.mobnav{display:none}
main{min-width:0}
.page{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:28px clamp(16px,4vw,44px)}
.page[hidden]{display:none}
h1{font-size:2rem;line-height:1.2;color:var(--fg);margin:0 0 16px;font-weight:800;text-wrap:balance}
h2{font-size:1.35rem;margin:36px 0 10px;text-wrap:balance;border-top:1px solid var(--line);padding-top:24px}
h3{font-size:1.08rem;margin:24px 0 8px}
p,li{max-width:72ch}
a{color:var(--link)}
a:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--rule);outline-offset:2px}
a.kitfile{font-family:var(--mono);font-size:.9em}
code{font-family:var(--mono);font-size:.86em;background:var(--code-bg);padding:1px 5px;border-radius:4px}
pre{background:var(--code-bg);border:1px solid var(--line);border-radius:6px;padding:14px;overflow-x:auto;position:relative;line-height:1.45}
pre code{background:none;padding:0;font-size:.84rem}
pre.mermaid{background:var(--surface);text-align:center}
.copy{position:absolute;top:6px;right:6px;font:600 .75rem var(--sans);padding:4px 10px;border-radius:4px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;min-height:30px}
.tbl{overflow-x:auto;margin:12px 0}
table{border-collapse:collapse;font-size:.9rem;font-variant-numeric:tabular-nums}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:var(--code-bg);font-weight:700}
blockquote{margin:14px 0;padding:10px 16px;background:var(--note-bg);border-left:4px solid var(--note-line);border-radius:0 6px 6px 0}
blockquote p{margin:4px 0}
ul.task-list{list-style:none;padding-left:4px}
.task-list-item input{width:18px;height:18px;margin-right:8px;vertical-align:-3px;accent-color:var(--link)}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:28px;flex-wrap:wrap}
.pager a{display:inline-flex;align-items:center;min-height:44px;padding:8px 14px;border:1px solid var(--line);border-radius:6px;text-decoration:none;background:var(--surface);font-weight:600}
.foot{font-size:.8rem;color:var(--muted);margin-top:20px}
@media (max-width:860px){
  .wrap{grid-template-columns:minmax(0,1fr);gap:16px;padding-block:16px 48px}
  nav{display:none}
  .mobnav{display:block}
  .mobnav label{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
  .mobnav select{width:100%;min-height:44px;font:600 1rem var(--sans);padding:6px 10px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
  h1{font-size:1.6rem}
  header img{height:30px}
  header .sub{display:none}
  header .t{font-size:1rem}
  [id]{scroll-margin-top:80px}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
.task-list-item input{cursor:pointer}
.task-list-item.done{color:var(--muted)}
.task-list-item.done > input + *{text-decoration:none}
.checkbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin:8px 0 12px;font-size:.85rem;color:var(--muted)}
.checkbar b{color:var(--fg);font-variant-numeric:tabular-nums}
.checkbar button{font:600 .8rem var(--sans);min-height:32px;padding:4px 10px;border-radius:4px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.kitnote{font-size:.78rem;color:var(--muted);margin-left:4px}
.kitmsg{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:6px;font-size:.9rem;z-index:20;max-width:calc(100% - 32px)}
</style>

<script>
(function(){
  var pages=[].slice.call(document.querySelectorAll('section.page'));
  var links=[].slice.call(document.querySelectorAll('nav a'));
  var sel=document.getElementById('pagesel');
  pages.forEach(function(p,i){
    var d=document.createElement('div');d.className='pager';
    var prev=pages[i-1],next=pages[i+1];
    function lab(s){var h=s.querySelector('h1');return h?h.textContent.replace(/¶/g,''):s.id}
    d.innerHTML=(prev?'<a href="#'+prev.id+'">← '+lab(prev)+'</a>':'<span></span>')+(next?'<a href="#'+next.id+'">'+lab(next)+' →</a>':'');
    p.appendChild(d);
  });
  document.querySelectorAll('table').forEach(function(t){var w=document.createElement('div');w.className='tbl';t.parentNode.insertBefore(w,t);w.appendChild(t)});
  document.querySelectorAll('pre > code').forEach(function(c){
    var b=document.createElement('button');b.className='copy';b.type='button';b.textContent='Copy';
    b.addEventListener('click',function(){
      var done=function(){b.textContent='Copied';setTimeout(function(){b.textContent='Copy'},1500)};
      try{navigator.clipboard.writeText(c.textContent).then(done,sel2)}catch(e){sel2()}
      function sel2(){var r=document.createRange();r.selectNodeContents(c);var s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent='Selected, press Ctrl+C'}
    });
    c.parentNode.appendChild(b);
  });
  function show(){
    var h=decodeURIComponent(location.hash.slice(1));
    var el=h&&document.getElementById(h);
    var page=el?(el.closest('section.page')||pages[0]):pages[0];
    pages.forEach(function(p){p.hidden=(p!==page)});
    links.forEach(function(a){a.toggleAttribute('aria-current',a.getAttribute('href')==='#'+page.id);if(a.hasAttribute('aria-current'))a.setAttribute('aria-current','page')});
    sel.value=page.id;
    if(el&&el!==page){el.scrollIntoView()}else{setTimeout(function(){window.scrollTo(0,0)},0)}
  }
  sel.addEventListener('change',function(){location.hash=sel.value});
  window.addEventListener('hashchange',show);
  show();
})();
</script>
<script>
(function(){
  // Tickable checklists. Ticks are saved to the artifact's shared store when
  // available (so Claude can read the results), else to this browser only.
  var KEY='hydrant-guide-checks';
  function h(str){var x=5381;for(var i=0;i<str.length;i++){x=((x<<5)+x+str.charCodeAt(i))|0}return (x>>>0).toString(36)}
  var boxes=[].slice.call(document.querySelectorAll('.task-list-item input[type=checkbox]'));
  boxes.forEach(function(b){
    var li=b.closest('li'),page=b.closest('section.page');
    var text=li.textContent.trim().replace(/\s+/g,' ');
    b.disabled=false;b.dataset.key=page.id+'-'+h(text);b.dataset.text=text.slice(0,200);b.dataset.page=page.id;
    b.setAttribute('aria-label',text.slice(0,120));
  });
  var state={};
  function local(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return {}}}
  function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
  var bars={};
  document.querySelectorAll('section.page').forEach(function(p){
    var mine=boxes.filter(function(b){return b.dataset.page===p.id});
    if(!mine.length)return;
    var bar=document.createElement('div');bar.className='checkbar';
    bar.innerHTML='<span><b class="n">0</b> of '+mine.length+' checked</span><span class="where">Saved in this browser</span><button type="button">Clear this page</button>';
    var h1=p.querySelector('h1');h1.parentNode.insertBefore(bar,h1.nextSibling);
    bars[p.id]={bar:bar,boxes:mine};
    bar.querySelector('button').addEventListener('click',function(){mine.forEach(function(b){if(b.checked){b.checked=false;change(b)}})});
  });
  function render(){
    boxes.forEach(function(b){var on=!!(state[b.dataset.key]&&state[b.dataset.key].done);b.checked=on;b.closest('li').classList.toggle('done',on)});
    Object.keys(bars).forEach(function(id){bars[id].bar.querySelector('.n').textContent=bars[id].boxes.filter(function(b){return b.checked}).length});
  }
  var db=null,col=null;
  function change(b){
    var on=b.checked;b.closest('li').classList.toggle('done',on);
    state[b.dataset.key]={done:on};render();
    if(col){col.doc(b.dataset.key).set({done:on,page:b.dataset.page,text:b.dataset.text,at:new Date().toISOString()}).catch(function(){saveLocal()})}
    else saveLocal();
  }
  boxes.forEach(function(b){b.addEventListener('change',function(){change(b)})});
  state=local();render();
  if(window.claude&&window.claude.use){
    window.claude.use('db').then(function(d){
      if(!d)return;db=d;col=db.collection('checks');
      Object.keys(bars).forEach(function(id){bars[id].bar.querySelector('.where').textContent='Saved for everyone with this link'});
      col.onSnapshot(function(snap){
        var s={};snap.docs.forEach(function(doc){var v=doc.data()||{};s[doc.id]={done:!!v.done}});
        state=s;render();
      },function(){});
    }).catch(function(){});
  }
})();
</script>
<script>
(function(){
  // Kit file links: save the embedded copy through the viewer's downloads capability.
  // .py files can't be offered on their own here, so they point to the zip.
  var el=document.getElementById('kitdata');var kit={};try{kit=JSON.parse(el.textContent)}catch(e){}
  var ZIP='kit/hydrant-mvp.zip',dl=null,ready=false;
  var links=[].slice.call(document.querySelectorAll('a.kitfile[data-kit]'));
  links.forEach(function(a){
    var k=a.dataset.kit;
    if(!kit[k]){a.dataset.kit=ZIP;a.title='Included in hydrant-mvp.zip';var n=document.createElement('span');n.className='kitnote';n.textContent='(in the zip)';a.after(n)}
  });
  function msg(t){var m=document.createElement('div');m.className='kitmsg';m.setAttribute('role','status');m.textContent=t;document.body.appendChild(m);setTimeout(function(){m.remove()},4000)}
  function bytes(b64){var s=atob(b64),u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u}
  links.forEach(function(a){a.addEventListener('click',function(ev){
    if(!dl)return; // no downloads here: fall through to the Downloads page
    ev.preventDefault();
    var k=a.dataset.kit;
    dl.save({filename:k.split('/').pop(),data:bytes(kit[k])}).catch(function(e){
      if(e&&e.code==='declined')return;
      msg('Download not available here. Get it from the GitHub repo: docs/'+k);
    });
  })});
  if(window.claude&&window.claude.use){window.claude.use('downloads').then(function(d){dl=d}).catch(function(){})}
})();
</script>
